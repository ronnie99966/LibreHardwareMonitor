
- name: Publish Windows x64
  shell: pwsh
  run: |
    dotnet publish `
      LibreHardwareMonitor.Windows.Forms/LibreHardwareMonitor.Windows.Forms.csproj `
      --configuration Release `
      --framework net10.0-windows `
      --runtime win-x64 `
      --self-contained true `
      -p:Platform=x64 `
      -p:AssemblyName=LibreHardwareMonitor `
      --output ./publish/win-x64

- name: Verify executable
  shell: pwsh
  run: |
    $exe = "./publish/win-x64/LibreHardwareMonitor.exe"
    if (!(Test-Path $exe)) {
      throw "EXE not found: $exe"
    }

- name: Upload Binary
  uses: actions/upload-artifact@v4
  with:
    name: LibreHardwareMonitor-Windows-x64
    path: publish/win-x64/
    if-no-files-found: error
